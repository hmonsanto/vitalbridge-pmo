<div style="font-family: Inter, Arial, sans-serif; color: #221e1a; max-width: 480px; margin: 0 auto; padding: 24px;">
  <h2 style="font-family: Georgia, serif; color: #6b1f2a; margin: 0 0 16px;">Reset your password</h2>
  <p>Someone asked to reset the password for your VitalBridge RX PMO account. If that was you, use the button below. The link works once and expires soon.</p>
  <p style="margin: 24px 0;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery"
       style="background: #6b1f2a; color: #ffffff; padding: 12px 20px; border-radius: 10px; text-decoration: none; font-weight: 600;">
      Choose a new password
    </a>
  </p>
  <p style="color: #7a6f63; font-size: 13px;">If you did not ask for this, ignore this email: your password stays the same.</p>
</div>
